spring.application.name=vital-flow-backend
server.port=${BACKEND_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vitalflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
